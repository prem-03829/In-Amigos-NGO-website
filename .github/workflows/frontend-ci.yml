name: Frontend CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Lint
      run: npm run lint
      continue-on-error: true # Allow build to continue even if lint has warnings

    - name: Build
      run: npm run build

    # Optional: You can add deployment steps here (e.g., to GitHub Pages, Vercel, or Netlify)
    # - name: Deploy to...
    #   ...
